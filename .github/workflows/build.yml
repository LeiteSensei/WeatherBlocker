name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Set VCPKG_ROOT
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset release

      - name: Show vcpkg logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem C:\vcpkg\buildtrees -Recurse -Include *-err.log,*-out.log -ErrorAction SilentlyContinue | ForEach-Object {
            "=== $($_.FullName)"
            Get-Content $_ -Tail 60
          }

      - name: Build
        run: cmake --build build/release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item build/release/WeatherBlocker.dll package/SKSE/Plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherBlocker
          path: package
